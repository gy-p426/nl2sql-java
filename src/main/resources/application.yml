spring:
  application:
    name: nl2sql-service
  
  # nl2sql数据库配置（用于存储系统数据）
  datasource:
    url: jdbc:mysql://localhost:3306/nl2sql?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: GMT+8

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB        # 单个文件最大大小
      max-request-size: 100MB     # 整个请求最大大小
      file-size-threshold: 10MB   # 文件写入磁盘的阈值

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.nl2sql: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %level - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %level - %msg%n"
  file:
    name: logs/nl2sql.log

nl2sql:
  # 数据库配置
  databases:
    - name: db1
      host: localhost
      port: 3306
      username: root
      password: root
      databases:
        - yibin2
        - yibinhumanresources
        - yibinsalary
        - exceldatabase
      pool:
        maximum-pool-size: 10
        minimum-idle: 5
        connection-timeout: 30000
  
  # 火山引擎配置（保留兼容性）
  volcano-engine:
    api-key: ${VOLCANO_API_KEY:7d7ec6e7-1f52-4deb-b881-7ea57442399f}
    model: deepseek-v3-1-250821
    timeout: 1800000
    base-url: https://ark.cn-beijing.volces.com/api/v3
  
  # Ollama配置
  ollama:
    enabled: false
    host: http://localhost:11435
    model: deepseek-r1:14b
    timeout: 1800000
  
  # 模型提供商选择
  model:
    provider: volcano_engine  # volcano_engine 或 ollama
  
  # 多LLM配置
  llm:
    # 任务路由配置
    routing:
      continuous-question: doubao-lite
      database-selection: deepseek-v3-2
      keyword-extraction: deepseek-v3-2
      sql-generation: multi-model  # 使用多模型并行
    
    # 模型配置
    models:
      # 连续问题判断模型
      doubao-lite:
        provider: volcano-engine
        base-url: https://ark.cn-beijing.volces.com/api/v3
        api-key: ${VOLCANO_API_KEY:7d7ec6e7-1f52-4deb-b881-7ea57442399f}
        model: doubao-seed-1-6-lite-251015
        timeout: 60000
        enabled: true
      
      # 数据库选择和关键词提取模型
      deepseek-v3-2:
        provider: volcano-engine
        base-url: https://ark.cn-beijing.volces.com/api/v3
        api-key: ${VOLCANO_API_KEY:7d7ec6e7-1f52-4deb-b881-7ea57442399f}
        model: deepseek-v3-2-251201
        timeout: 180000
        enabled: true
      
      # SQL生成模型1
      deepseek-v3-1:
        provider: volcano-engine
        base-url: https://ark.cn-beijing.volces.com/api/v3
        api-key: ${VOLCANO_API_KEY:7d7ec6e7-1f52-4deb-b881-7ea57442399f}
        model: deepseek-v3-1-terminus
        timeout: 180000
        enabled: true
      
      # SQL生成模型2（与deepseek-v3-2相同）
      deepseek-v3-2-sql:
        provider: volcano-engine
        base-url: https://ark.cn-beijing.volces.com/api/v3
        api-key: ${VOLCANO_API_KEY:7d7ec6e7-1f52-4deb-b881-7ea57442399f}
        model: deepseek-v3-2-251201
        timeout: 180000
        enabled: true
      
      # SQL生成模型3
      doubao-code:
        provider: volcano-engine
        base-url: https://ark.cn-beijing.volces.com/api/v3
        api-key: ${VOLCANO_API_KEY:7d7ec6e7-1f52-4deb-b881-7ea57442399f}
        model: doubao-seed-code-preview-251028
        timeout: 180000
        enabled: true
      
      # SQL评判模型
      glm-4:
        provider: volcano-engine
        base-url: https://ark.cn-beijing.volces.com/api/v3
        api-key: ${VOLCANO_API_KEY:7d7ec6e7-1f52-4deb-b881-7ea57442399f}
        model: glm-4-7-251222
        timeout: 60000
        enabled: true
  
  # 系统设置
  settings:
    refresh-db: true
    refresh-schema: true
    save-results: false
    max-retries: 5
    cache-max-size: 1000
    cache-expire-minutes: 60
  
  # 文件路径
  files:
    annotation: annotations.json
    session: session.txt
    db-overview: db.txt
    schema-dir: .
  
  # 测试图片目录
  test-images-dir: test_images
